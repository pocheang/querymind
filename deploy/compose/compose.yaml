name: querymind

# ARC-01: state every worker must agree on lives outside the backend process --
# limits, approvals, execution streams and the ingest queue in Redis, vectors in
# a Chroma server, sessions in SQLite, ingestion in one `ingest-worker`. Shared
# is the default since phase 9 (it was the compose.shared-state.yaml overlay);
# the `init` service moves a single-worker installation's data across on the
# first start, so an upgrade has no manual step. STATE_BACKEND stays
# overridable from the shell because `environment:` outranks `env_file:`.
x-shared-state: &shared-state
  STATE_BACKEND: ${STATE_BACKEND:-shared}
  HISTORY_BACKEND: sqlite
  SESSION_METADATA_BACKEND: database
  CHROMA_SERVER_URL: http://chroma:8000

services:
  # Only n8n uses this. The backend does not: it is SQLite-only
  # (app/services/sessions/metadata_db.py), so postgres sits in the same opt-in
  # profile rather than starting for everyone and gating the backend's startup
  # on a database it never opens.
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    profiles: [with-n8n]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-querymind}
      POSTGRES_USER: ${POSTGRES_USER:-querymind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-querymind}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [querymind]

  neo4j:
    image: neo4j:5.26.3
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks: [querymind]

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    # AOF stays on: Redis is no longer only a cache. It holds the ingest queue,
    # pending approval tokens and the execution event streams, so a restart
    # without persistence would silently drop queued uploads and strand every
    # approval a user had been shown.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    # The healthcheck runs inside the container, where REDIS_PASSWORD was never
    # set -- it only reached the command line above -- so `$${REDIS_PASSWORD}`
    # expanded to nothing, every probe failed with WRONGPASS, and anything
    # waiting for `service_healthy` never started. redis-cli reads REDISCLI_AUTH
    # itself, which also keeps the password out of the probe's argv.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [querymind]

  chroma:
    # The server's version follows the client's (chromadb in uv.lock): the HTTP
    # API is only guaranteed between matching releases.
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    volumes:
      - chroma_server_data:/data
    # The image has bash and no wget, curl or python (measured on 1.5.9), so the
    # probe speaks HTTP over bash's /dev/tcp. A probe naming a tool the image
    # lacks never passes, and holds every dependent service at "starting".
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8000 && printf "GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [querymind]

  # Runs once, to completion, before anything that uses the databases starts:
  # every SQLite migration, the first administrator, the purge of retired
  # per-user model keys, and -- in shared mode -- copying a single-worker
  # installation's file sessions and embedded vectors to where shared mode reads
  # them, each read back to verify (app/init_app.py). A failed verification
  # exits non-zero, and nothing below starts on half-moved data. The workers
  # still run the migrations at startup as a backstop; they find nothing to do.
  init:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["python", "-m", "app.init_app"]
    restart: "no"
    # The image's HTTP probe asks port 8000, which this never serves.
    healthcheck:
      disable: true
    env_file:
      - ${RUNTIME_ENV_FILE:-../../.runtime/production.env}
    environment:
      <<: *shared-state
      CHROMA_PERSIST_DIR: /app/data/chroma
    # chroma_data is the embedded store an older installation wrote; it is read
    # here as the migration source and never deleted.
    volumes:
      - chroma_data:/app/data/chroma
      - app_data:/app/data
    depends_on:
      chroma:
        condition: service_healthy
    networks: [querymind]

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-../../.runtime/production.env}
    environment:
      <<: *shared-state
      # The frontend nginx is the only peer allowed to name the client's address
      # (X-Forwarded-For). Its address is whatever Docker assigns inside this
      # subnet, so the trust is the subnet -- which is why the network below
      # pins one (SEC-02, app/api/transport/client_address.py).
      QUERYMIND_TRUSTED_PROXIES: ${QUERYMIND_SUBNET:-172.29.72.0/24}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CHROMA_PERSIST_DIR: /app/data/chroma
      # No DATABASE_URL here on purpose. It used to be set to a
      # postgresql+asyncpg:// URL that the application silently ignored --
      # `_get_db_path` honours only `sqlite:///` and falls back to
      # ./data/querymind.db for anything else, which the app_data volume
      # persists. A deployment manifest that names a database nothing connects
      # to is worse than one that names none.
    volumes:
      - chroma_data:/app/data/chroma
      - chunks_data:/app/data/chunks
      - app_data:/app/data
      - logs_data:/app/logs
    depends_on:
      init:
        condition: service_completed_successfully
      chroma:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [querymind]

  # Exactly one. Its startup treats every job RQ still lists as started as
  # abandoned, which is only true while it is the only worker.
  ingest-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["python", "-m", "app.ingest_worker"]
    restart: unless-stopped
    # Replaces the image's HTTP probe, which asks port 8000 -- a port this
    # process never serves, so it would report unhealthy while working. The
    # probe takes ~1s idle, but measured 9-16s while the worker rewrote a 30 MB
    # corpus and Chroma took 14,000 vectors (disk contention, not the probe),
    # and a 15s timeout flipped a working worker to unhealthy. It also keeps
    # passing for up to RQ's worker TTL (~7 min) after a worker dies, since the
    # registration outlives the process until it expires.
    healthcheck:
      test: ["CMD", "python", "-m", "app.ingest_worker", "--check"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
    env_file:
      - ${RUNTIME_ENV_FILE:-../../.runtime/production.env}
    environment:
      <<: *shared-state
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    # The same files the backend reads and deletes from: the registry, the
    # corpus, uploads and the index lock all live under these.
    volumes:
      - chunks_data:/app/data/chunks
      - app_data:/app/data
      - logs_data:/app/logs
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks: [querymind]

  frontend:
    build:
      context: ../..
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # 127.0.0.1: busybox wget tries ::1 for localhost and nginx listens on IPv4 only.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks: [querymind]

  n8n:
    image: n8nio/n8n:1.94.1
    restart: unless-stopped
    profiles: [with-n8n]
    environment:
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: Asia/Shanghai
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-querymind}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks: [querymind]

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  redis_data:
  chroma_data:
  chroma_server_data:
  chunks_data:
  app_data:
  logs_data:
  n8n_data:

networks:
  querymind:
    driver: bridge
    # Pinned so the backend can trust exactly this range for X-Forwarded-For
    # (QUERYMIND_TRUSTED_PROXIES above). Override QUERYMIND_SUBNET if it collides with
    # a network the host already routes.
    ipam:
      config:
        - subnet: ${QUERYMIND_SUBNET:-172.29.72.0/24}
