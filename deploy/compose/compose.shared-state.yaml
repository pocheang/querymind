# ARC-01 phase 5: state every worker must agree on leaves the backend process.
#
#   docker compose -f compose.yaml -f compose.production.yaml -f compose.shared-state.yaml up -d
#
# Opt-in, because it changes what a deployment is made of: Redis becomes
# required (limits, approvals, execution streams, the ingest queue), vectors
# live in a Chroma server rather than a directory inside the backend, and
# ingestion runs in a separate `ingest-worker`. Before switching an existing
# installation, copy what it already has:
#
#   python scripts/migrate_sessions_to_sqlite.py      # file sessions -> sqlite
#   python scripts/migrate_chroma_to_server.py         # embedded vectors -> server
#
# APP_WORKERS stays 1 until ARC-01 phases 6-7 (cross-process cache
# invalidation, the startup schema race) are done; see
# docs/querymind-deep-dive/arc-01-plan.html.

x-shared-state: &shared-state
  STATE_BACKEND: shared
  HISTORY_BACKEND: sqlite
  SESSION_METADATA_BACKEND: database
  CHROMA_SERVER_URL: http://chroma:8000

services:
  chroma:
    # The server's version follows the client's (chromadb in uv.lock): the HTTP
    # API is only guaranteed between matching releases.
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    volumes:
      - chroma_server_data:/data
    # No healthcheck: which probe tools the image ships was not verified, and a
    # probe that cannot run holds every dependent service at "starting" forever.
    # Nothing opens the vector store at startup -- it is opened on first use --
    # so `service_started` is enough ordering.
    networks: [querymind]

  backend:
    environment:
      <<: *shared-state
    depends_on:
      chroma:
        condition: service_started

  # Exactly one. Its startup treats every job RQ still lists as started as
  # abandoned, which is only true while it is the only worker.
  ingest-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["python", "-m", "app.ingest_worker"]
    restart: unless-stopped
    deploy:
      replicas: 1
    env_file:
      - ${RUNTIME_ENV_FILE:-../../.runtime/production.env}
    environment:
      <<: *shared-state
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    # The same files the backend reads and deletes from: the registry, the
    # corpus, uploads and the index lock all live under these.
    volumes:
      - chunks_data:/app/data/chunks
      - app_data:/app/data
      - logs_data:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      neo4j:
        condition: service_healthy
    networks: [querymind]

volumes:
  chroma_server_data:
