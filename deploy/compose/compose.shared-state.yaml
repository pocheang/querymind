# ARC-01 phase 5: state every worker must agree on leaves the backend process.
#
#   docker compose -f compose.yaml -f compose.production.yaml -f compose.shared-state.yaml up -d
#
# Opt-in, because it changes what a deployment is made of: Redis becomes
# required (limits, approvals, execution streams, the ingest queue), vectors
# live in a Chroma server rather than a directory inside the backend, and
# ingestion runs in a separate `ingest-worker`. Before switching an existing
# installation, copy what it already has:
#
#   python scripts/migrate_sessions_to_sqlite.py      # file sessions -> sqlite
#   python scripts/migrate_chroma_to_server.py         # embedded vectors -> server
#
# Since ARC-01 phase 7 the `init` service creates and migrates every table
# before any worker starts; caches follow other workers since phase 6. See
# docs/querymind-deep-dive/arc-01-plan.html.

x-shared-state: &shared-state
  STATE_BACKEND: shared
  HISTORY_BACKEND: sqlite
  SESSION_METADATA_BACKEND: database
  CHROMA_SERVER_URL: http://chroma:8000

services:
  chroma:
    # The server's version follows the client's (chromadb in uv.lock): the HTTP
    # API is only guaranteed between matching releases.
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    volumes:
      - chroma_server_data:/data
    # The image has bash and no wget, curl or python (measured on 1.5.9), so the
    # probe speaks HTTP over bash's /dev/tcp. A probe naming a tool the image
    # lacks never passes, and holds every dependent service at "starting".
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8000 && printf "GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [querymind]

  # Runs once, to completion, before anything that uses the databases starts:
  # every SQLite migration, the first administrator, and the purge of retired
  # per-user model keys (app/init_app.py). With several workers, doing this in
  # each one meant two processes creating the same tables at once. The workers
  # still run the same code at startup as a backstop; it finds nothing to do.
  init:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["python", "-m", "app.init_app"]
    restart: "no"
    # The image's HTTP probe asks port 8000, which this never serves.
    healthcheck:
      disable: true
    env_file:
      - ${RUNTIME_ENV_FILE:-../../.runtime/production.env}
    environment:
      <<: *shared-state
    volumes:
      - app_data:/app/data
    networks: [querymind]

  backend:
    environment:
      <<: *shared-state
    depends_on:
      init:
        condition: service_completed_successfully
      chroma:
        condition: service_healthy

  # Exactly one. Its startup treats every job RQ still lists as started as
  # abandoned, which is only true while it is the only worker.
  ingest-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["python", "-m", "app.ingest_worker"]
    restart: unless-stopped
    # Replaces the image's HTTP probe, which asks port 8000 -- a port this
    # process never serves, so it would report unhealthy while working. The
    # probe takes ~1s idle, but measured 9-16s while the worker rewrote a 30 MB
    # corpus and Chroma took 14,000 vectors (disk contention, not the probe),
    # and a 15s timeout flipped a working worker to unhealthy. It also keeps
    # passing for up to RQ's worker TTL (~7 min) after a worker dies, since the
    # registration outlives the process until it expires.
    healthcheck:
      test: ["CMD", "python", "-m", "app.ingest_worker", "--check"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
    env_file:
      - ${RUNTIME_ENV_FILE:-../../.runtime/production.env}
    environment:
      <<: *shared-state
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    # The same files the backend reads and deletes from: the registry, the
    # corpus, uploads and the index lock all live under these.
    volumes:
      - chunks_data:/app/data/chunks
      - app_data:/app/data
      - logs_data:/app/logs
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks: [querymind]

volumes:
  chroma_server_data:
