name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A branch that has no pull request open runs nothing otherwise, which is how
  # a change lands on a branch unverified and is discovered at review time.
  workflow_dispatch:

# Least privilege, for the same threat model that pins the third-party action
# below to a commit: that step runs with this token. Nothing in this workflow
# writes to the repository -- no comment, no label, no push -- so read is all of
# it, and a job that ever needs more has to say so itself. Without this block the
# token carries whatever the repository's default is, which is write on a
# repository nobody has changed it on.
#
# tests/core/test_ci_workflow_is_loadable.py fails if it goes missing, because
# the rule that would otherwise catch it lives in SonarCloud and only runs after
# a push -- the same reason the SHA-pinning assertion is there.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a pull-request run is free -- only its latest head matters. A run
  # on main is not: it is the only analysis that commit will ever get, and once
  # the SonarCloud scanner is switched on, a cancelled one leaves a hole in the
  # new-code baseline that nothing refills.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Its own job rather than the first four steps of `backend`, because a job
  # stops at its first failure: a style slip used to hide every test result
  # behind it, and the fix was a second push to find out whether the suite was
  # also broken. It needs no project dependencies, so it reports in well under a
  # minute while the suite is still installing.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing in this job talks back to GitHub, so leaving a credential in
          # .git/config for the rest of the run buys nothing -- and every step
          # after this one executes third-party code that can read it.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # First, and stdlib only: a credential reaching this repository is the one
      # failure that cannot be fixed by a follow-up commit. The pre-commit hook
      # runs the same script over staged files; this is the copy that catches a
      # --no-verify or a clone with no hooks installed.
      #
      # Scans every tracked file rather than the diff. That is what makes the
      # two baselines in the script a ratchet: an exemption that no longer
      # matches anything fails here, so the allowlist cannot silently widen.
      - name: Sensitive content gate
        run: python scripts/check_sensitive.py

      - name: Install ruff
        # Exact, and the same version pyproject's dev extra pins. `>=` meant CI
        # picked up every new release, so the formatter changed without anyone
        # touching the code -- which is how four green-locally commits failed
        # here in a row.
        run: 'pip install --only-binary :all: "ruff==0.16.5"'

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Both answers are wanted. Cancelling 3.11 because 3.12 broke tells you
      # less than the two results together, which is the whole point of running
      # two.
      fail-fast: false
      matrix:
        # pyproject declares `requires-python = ">=3.11"` and the lock resolves
        # for that whole range -- numpy is pinned twice in the exports for
        # exactly this reason. Until now only 3.11 was ever run, so the rest of
        # that claim was untested. 3.11 stays canonical: it is what the image,
        # the conda environment and the coverage baseline are.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Key the cache on the file this job actually installs from. Left
          # unset, the action hashes whatever its default patterns happen to
          # match, which is not requirements/ci.txt -- so a regenerated lock
          # restored the previous run's wheels.
          cache-dependency-path: requirements/ci.txt

      - name: Install dependencies
        # From the lock, not from the ranges in pyproject.toml: every version is
        # pinned and every archive hashed, so pip refuses bytes that do not match
        # and refuses to resolve anything the lock does not name. Regenerate with
        # `make lock`; tests/core/test_dependency_locks_are_current.py fails if
        # pyproject moves and the lock does not.
        #
        # --only-binary keeps setup.py from running. Two packages are exempted
        # because they publish no wheel at all -- not for this platform, for any:
        # jieba, and forbiddenfruit (pulled in by blockbuster). The order of the
        # flags matters: --only-binary :all: clears the no-binary set, so it has
        # to come first.
        #
        # That list is produced by `python scripts/check_lock_wheels.py`, which
        # asks PyPI about the whole lock in one pass. Finding these one red build
        # at a time is exactly what that script exists to stop -- it happened
        # twice before it was written.
        run: 'pip install --only-binary :all: --no-binary forbiddenfruit,jieba -r requirements/ci.txt'

      # The project itself is deliberately not installed. `app/` sits at the
      # repository root and every step below runs from there, so it imports from
      # the checkout; nothing reads distribution metadata and there are no entry
      # points, which is what an install would add. Verified by uninstalling it
      # and running the whole suite: 605 passed.
      #
      # It also removes the last unlocked `pip install` from this job, which is
      # what githubactions:S8544 was pointing at -- `pip install -e . --no-deps`
      # resolves nothing and locks nothing, so the rule was right about the shape
      # and the answer was to stop doing it rather than to pin it.

      - name: Cache pre-commit hook environments
        if: matrix.python-version == '3.11'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Repository hygiene hooks
        # .pre-commit-config.yaml declares six hooks that nothing here ran:
        # check-yaml, check-json, end-of-file-fixer, trailing-whitespace,
        # mixed-line-ending and check-sensitive. The first five had no CI copy at
        # all, so a `--no-verify` commit -- or a clone where nobody ran
        # `pre-commit install`, which is every fresh one -- drifted them silently.
        # That is the argument the sensitive-content gate above already makes for
        # itself; these five had only the hook.
        #
        # After the install rather than beside ruff, because pre-commit comes out
        # of the lock there. Installing it separately would put back the unlocked
        # `pip install` this job deliberately removed.
        #
        # SKIP names the three that CI runs by itself: ruff and ruff-format are
        # the two steps above, and check-sensitive is the gate at the top, which
        # already reads every tracked file rather than the staged ones.
        # Once, not once per interpreter: what it checks -- line endings, final
        # newlines, parseable YAML -- cannot differ between them.
        if: matrix.python-version == '3.11'
        env:
          SKIP: ruff,ruff-format,check-sensitive
        run: pre-commit run --all-files --show-diff-on-failure

      # The endpoint census -- a guard against a refactor silently dropping
      # routers -- used to be an inline `python -c` here, with a floor of 140
      # against an actual 157: seventeen operations could disappear and this step
      # stayed green. It is tests/api/test_endpoint_census.py now, against an
      # exact tracked baseline, so `make test` catches it before a push and a
      # failure names the number rather than a shell assertion.

      - name: Tests
        # --timeout is a hang detector, not a latency budget -- the same
        # distinction the stage ceilings in Settings are documented with. A test
        # that never returns otherwise consumes this job's whole 20-minute
        # ceiling, and the run is reported as *cancelled* with nothing in the log
        # naming the test; --timeout-method=thread dumps every thread's stack and
        # fails that one test instead. This repository's two worst outages were
        # both hangs (concurrent DDGS construction, an async cache driven from a
        # worker thread), so the shape is not hypothetical.
        #
        # 120s against a slowest test of 3.6s, measured over the whole suite in a
        # clean requirements/ci.txt environment. A runner is slower than that
        # measurement, not thirty times slower.
        #
        # Coverage is written whether or not the scan in the analysis job runs,
        # so an upload that never happens shows up as a missing report rather
        # than as a metric that quietly stays empty -- which is the state this
        # project was in until now: Automatic Analysis cannot read a coverage
        # report, so the suite's coverage had never reached SonarCloud at all.
        run: pytest tests/ -q --timeout=120 --timeout-method=thread --cov=app --cov-report=xml:coverage.xml

      - name: Coverage ratchet
        # Prints the number, and fails if it falls below the tracked baseline.
        # It used to only print: with the SonarCloud scanner dormant, nothing
        # anywhere could turn a drop in coverage red.
        #
        # One baseline, measured on one interpreter. Two would differ by whichever
        # version-gated branches each one takes, and neither number would mean
        # "the project's coverage".
        if: matrix.python-version == '3.11'
        run: python scripts/check_coverage.py ratchet

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        # Not `always()` any more: the 3.12 leg would race the 3.11 one for the
        # same artifact name, and v4 refuses the second upload rather than
        # merging it.
        if: always() && matrix.python-version == '3.11'
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      # Gates on errors. The threshold is a ratchet at the current warning
      # count, `--max-warnings 20` in package.json -- which is the only place it
      # is stated, so this comment cannot drift out of date with it the way it
      # did while claiming 24. Lower it as the warnings are fixed; never raise it.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      # Prettier, as the backend job runs `ruff format --check`. It was listed
      # in CLAUDE.md as a CI check long before any step ran it, and 116 files
      # drifted in the meantime. `.prettierrc` uses `endOfLine: auto` so a
      # Windows checkout (core.autocrlf=true) reports the same thing this does.
      - name: Format check
        run: npm run format:check

      # Shape and depth scale, as a ratchet. The chat screen once carried eight
      # radii and eighteen distinct shadows at the same time; that drift is
      # cheap to prevent and expensive to undo. Existing counts are frozen per
      # file in scripts/design-scale-baseline.json -- a file may improve, never
      # regress, and a new file starts at zero.
      - name: Design scale
        run: npm run lint:design

      # Store-reset coverage: the Zustand stores live for the lifetime of the
      # tab, so a field that survives logout shows the next person on a shared
      # browser the previous one's data. The test discovers fields rather than
      # listing them, so it catches one added to the store but forgotten in
      # INITIAL_STATE.
      - name: Tests
        # --coverage writes frontend/coverage/lcov.info, which the analysis job
        # downloads and hands to the scanner. Written whether or not that scan
        # runs, for the same reason the Python report is.
        run: npm test -- --run --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      # After the build on purpose: it compares every class name in src/ against
      # the CSS the browser actually receives, which does not exist until then.
      # `IntegrationsPanel` carried two names with no rule through a whole visual
      # rewrite and two contrast audits, because lint, tsc and the tests are all
      # blind to a class that matches nothing.
      - name: Dead classes
        run: npm run lint:classes

  # What the deployment installs, which until now nothing in CI ever built. The
  # backend image installs `requirements/runtime.txt` -- a different export of the
  # lock from the `ci.txt` every other job uses -- so a broken `make lock` could
  # go green here and fail at deploy, which is the worst place to find it. The
  # frontend image repeats the npm build inside node:20-alpine against an
  # unprivileged nginx base, where a `listen` directive left at 80 fails to bind
  # in a way the build itself does not notice.
  #
  # Built, not pushed. There is no registry in this workflow and no token that
  # could write to one -- the question being asked is whether the image can be
  # produced from this commit at all.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configuration layers render and validate
        # `deploy/scripts/config.py` is what turns config/env/* and
        # config/profiles/* into the file the application reads, and it enforces
        # rules no test covers -- duplicate keys, key shapes, the secrets each
        # environment must carry. Nothing ran it, so a bad layer was found by
        # deploying.
        #
        # All nine combinations, because they select different layers: production
        # validates 35 keys where development validates 32, and a key missing from
        # one profile is invisible in the others.
        #
        # The placeholder key is not a credential and is not one of this project's
        # secrets -- production refuses to validate without OPENAI_API_KEY *set*,
        # and what is being checked is the layer structure, not whether a key
        # works. It is deliberately not sk-shaped: the sensitive-content gate
        # matches shapes, and it is right to.
        env:
          OPENAI_API_KEY: placeholder-for-ci-validation
        run: |
          for environment in development test production; do
            for profile in fast balanced deep; do
              echo "--- $environment / $profile"
              python deploy/scripts/config.py validate --environment "$environment" --profile "$profile"
            done
          done

      - name: Build the backend image
        run: docker build -f Dockerfile -t querymind-backend:ci .

      - name: Build the frontend image
        run: docker build -f Dockerfile.frontend -t querymind-frontend:ci .

  # A third job because the scanner needs both coverage reports in one workspace,
  # and the two that produce them run in parallel with separate workspaces. That
  # was the defect: this step lived in the backend job, under a comment claiming
  # it picked the frontend's lcov up "alongside the Python report", and no step
  # anywhere copied that file across. Sonar does not fail on a report path that
  # does not exist -- it warns -- so switching the scanner on would have
  # published Python coverage and a silent zero for TypeScript.
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    # Job level, not step level: a step's own `env:` is not readable from that
    # step's `if:`, and the scan below is conditional on this being set. The
    # `secrets` context is not available in a job-level `if` at all, which is why
    # the job runs either way and the scan step is what gets skipped.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar reads SCM blame to decide what counts as new code, and every
          # condition on this project's quality gate is a new-code condition. A
          # shallow clone has no blame to read.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: .

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Coverage reports are where the scanner reads them
        # Reads the paths out of sonar-project.properties rather than repeating
        # them, so a rename on either side fails here instead of degrading the
        # scan to a warning nobody looks at. Runs whether or not the scan does:
        # with the scanner still dormant this is the only thing standing between
        # today and a repeat of the defect described above.
        run: python scripts/check_coverage.py reports

      - name: SonarCloud scan
        # Skipped until a SONAR_TOKEN secret exists, so this lands green and is
        # switched on deliberately. Turning it on also means turning Automatic
        # Analysis off in SonarCloud: the scanner refuses to run while that is
        # enabled. See sonar-project.properties.
        #
        # Pinned to a commit, not to `@v8`: a tag on somebody else's repository
        # can be moved, and this step runs with a token that can write analysis
        # results for this project. The GitHub-owned actions above keep their
        # major tags -- githubactions:S7637 flags third-party ones, and this was
        # the only one.
        if: env.SONAR_TOKEN != ''
        # v8.2.1
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"
