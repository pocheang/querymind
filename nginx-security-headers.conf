# Security headers for everything nginx serves itself: the SPA's index.html
# and its static assets (SEC-03). Copied into the image beside nginx.conf and
# included by every location that serves a file.
#
# Why an include rather than one block at server level: nginx drops every
# server-level add_header from a location that declares an add_header of its
# own, and the two locations that set Cache-Control (index.html and the
# hashed assets) did exactly that -- so the SPA entry page and every js/css
# file went out with no X-Frame-Options and no nosniff. Each such location
# includes this file again; tests/core/test_frontend_security_headers.py fails
# on a location that serves files without it.
#
# The /api/ locations do not include it: the backend sets its own headers on
# what it serves (app/api/transport/middleware.py), and two CSP headers on one
# response are enforced as their intersection rather than one replacing the
# other.
#
# script-src is 'self' alone. The production build has no inline script, no
# eval and no new Function (checked against dist/ when this was written), so
# 'unsafe-inline' / 'unsafe-eval' bought nothing but an XSS escape hatch. The
# browser smoke test (frontend/scripts/smoke-browser.mjs) fails on any CSP
# violation, so a dependency that starts needing either is caught in CI.
# style-src keeps 'unsafe-inline': React style attributes, ReactFlow, Recharts
# and the inlined critical CSS all depend on it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
