[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "querymind"
version = "0.7.0.3"
description = "QueryMind - Enterprise intelligent Q&A engine with multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.11"
# Core dependencies: smallest set that boots the FastAPI backend, vector store,
# graph integration, query orchestration, and basic PDF/text ingestion.
# Heavy ML/OCR stacks live in extras (see [project.optional-dependencies]).
dependencies = [
  "fastapi>=0.138.0,<1.0",
  "uvicorn>=0.49.0,<1.0",
  "pydantic>=2.13.0,<3.0",
  "pydantic-settings>=2.14.0,<3.0",
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "langgraph-cli[inmem]>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "langchain-chroma>=0.2.0",
  "chromadb>=0.5.5",
  "neo4j>=5.24.0",
  "langchain-openai>=1.2.0,<2.0",
  "openai>=2.44.0,<3.0",
  "langchain-anthropic>=1.4.0,<2.0",
  "langchain-ollama>=0.2.0",
  "pypdf>=5.0.0",
  "Pillow>=10.0.0",
  "python-dotenv>=1.2.0,<2.0",
  "ddgs>=8.0.0",
  "httpx>=0.28.0,<1.0",
  "orjson>=3.10.0",
  "tenacity>=9.0.0",
  "rank-bm25>=0.2.2",
  "jieba>=0.42.1",
  "python-multipart>=0.0.32,<1.0",
  "redis>=5.0.0",
  "rq>=2.0,<3",
  # /metrics across workers (multiprocess mode), ARC-01 phase 8.
  "prometheus-client>=0.20,<1",
  "authlib>=1.3.0",
  "itsdangerous>=2.1.0",
  "scikit-learn>=1.3.0",
  "aiofiles>=23.2.0",
  "psutil>=7.0.0,<8.0",
  "mcp>=1.24.0,<2.0"
]

[project.optional-dependencies]
# Nacos as a configuration source. Optional on purpose: the source returns
# nothing unless NACOS_ENABLED is true, and app/core/remote_config.py treats a
# missing SDK as "no client" and degrades to the local snapshot, so an
# installation that has not adopted a configuration centre never imports this.
# Pinned to the 1.x line on purpose: 2.x/3.x are a rewrite that imports as
# `v2.nacos` and whose `get_config` is a coroutine, and this client is called
# from synchronous Settings construction. See app/core/remote_config_nacos.py.
config-centre = [
  "nacos-sdk-python>=1.0.0,<2.0",
]
# Tesseract-based OCR for image and scanned-PDF ingestion. Requires the
# native ``tesseract`` binary on PATH (see TESSERACT_CMD env var).
ocr = [
  "pytesseract>=0.3.10",
]
# PaddleOCR layout-aware OCR (Chinese-friendly). Adds ~500MB of native libs.
paddle = [
  "paddlepaddle>=2.6.0",
  "paddleocr>=2.7.0",
]
# Docling document conversion for structured PDF/DOCX/PPTX parsing.
docling = [
  "docling>=2.93.0",
]
# Spreadsheet ingestion. DOCX/PPTX use Docling with a package-XML fallback.
office = [
  "openpyxl>=3.1.0",
  "pandas>=2.2.0,<3.0",
  "xlrd>=2.0.1",
  "duckdb>=1.0.0",
]
# PDF/image/table extraction support.
multimodal = [
  "pandas>=2.2.0,<3.0",
  "PyMuPDF>=1.24.0",
  "pdfplumber>=0.11.0",
  "tabulate>=0.9.0",
  "duckdb>=1.0.0",
]
# Cross-encoder reranking via sentence-transformers (BAAI/bge-reranker-v2-m3
# by default). Falls back to lexical scoring when missing.
reranker = [
  "sentence-transformers>=3.0.1",
]
# Convenience meta-extra: equivalent to the historical full install.
full = [
  "querymind[ocr,paddle,docling,office,reranker,multimodal]",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "pytest-xdist>=3.5.0",
  # A hang is this repository's recurring failure, not a rare one: concurrent
  # DDGS construction parked every thread at zero CPU, and an async cache driven
  # from asyncio.to_thread has deadlocked twice. In CI a hung test costs the
  # job's whole 20-minute ceiling, and the run is reported as *cancelled* with
  # no line saying which test never returned. --timeout-method=thread dumps
  # every thread's stack and fails that one test instead, which is the same
  # evidence `dump_traceback_later` was used to capture by hand.
  "pytest-timeout>=2.3.0",
  "reportlab>=4.0.0",
  # Declared rather than borrowed from langchain's transitive tree: the
  # workflow-parses test is the one thing standing between a mistyped YAML and
  # a CI run that reports failure without running anything.
  "pyyaml>=6.0",
  # Pinned exactly, not floored. CI installed the newest ruff on every run, so
  # its formatter changed under the repository: four consecutive runs failed
  # `ruff format --check` on commits that were clean locally, with no code
  # change between them. A formatter that moves on its own is a build that
  # breaks for reasons nobody introduced.
  "ruff==0.16.5",
  "pre-commit>=3.7.0",
  # ARC-01 moves rate limits, query-guard leases and execution streams into
  # Redis, and their atomicity lives in Lua scripts. A hand-written fake can
  # only agree with the code that wrote it; fakeredis runs the real commands,
  # and the `lua` extra (lupa) runs the scripts, so neither a developer machine
  # nor CI needs a Redis server to test them.
  "fakeredis[lua]>=2.26.0"
]

# A security floor on a package this project does not import.
#
# langgraph-api is langgraph-cli[inmem]'s dependency, not ours -- the application
# imports only `from langgraph.graph import END, START, StateGraph`. But 0.7.27
# carries PYSEC-2026-3857/3858 and requires `cryptography<47.0`, which held four
# more advisories open behind it, and `langgraph-cli[inmem]` asks only for
# `>=0.5.35`, so a re-resolution is free to pick it again.
#
# A constraint rather than a dependency, because that is what this is: it does not
# add langgraph-api to the graph, it says what version is acceptable if something
# else pulls it in. Regenerating with `uv lock --upgrade` cannot now walk back into
# the vulnerable range and leave the security workflow to notice a week later.
[tool.uv]
constraint-dependencies = ["langgraph-api>=0.10.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------
# Note (2026-08-28): pytest/coverage configuration was removed here ahead of the v0.7
# rewrite — `tests/` was cleared and will be rebuilt against the new architecture.
# Note (2026-08-29): a minimal pytest config is back. Tests are being rebuilt
# alongside the audit fixes, and CI needs discovery + asyncio mode to be
# configured rather than passed on the command line. Coverage is still not
# configured; there is no meaningful baseline to gate on yet.

[tool.pytest.ini_options]
testpaths = ["tests"]
# `app` is imported from the checkout, not from an installed distribution, so
# the root has to be on sys.path. `python -m pytest` puts it there and the
# `pytest` console script does not, which is a difference nobody should have to
# know: stating it here makes both work.
#
# It was invisible until 2026-09-02 because a stale editable install from an
# older name for this project -- __editable__.multi_agent_local_rag-0.3.3.pth --
# was still wiring the repository into site-packages on the machine it was
# tested on. Uninstalling the current package proved nothing while that
# remained, and CI, which has neither, failed at collection.
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  ".venv",
  ".tmp",
  "artifacts",
  "frontend",
  "data",
  ".langgraph_api",
  "internal_docs",
  "**/__pycache__",
]

[tool.ruff.lint]
# Conservative starter set; expand later as the codebase tightens.
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by formatter, many long log/string lines)
  "B008",  # function calls in argument defaults (FastAPI Depends/Query pattern)
  "B904",  # raise from inside except (project intentionally hides chains in some places)
  "UP007", # X | Y syntax for Optional (mixed style across codebase)
]

[tool.ruff.lint.per-file-ignores]
"app/services/agent_document_filter.py" = ["T201"]  # demo block under __main__
"app/evaluation/service.py" = ["T201"]       # CLI-style table printing is intentional

[tool.ruff.lint.isort]
known-first-party = ["app"]
