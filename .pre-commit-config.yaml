repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Two trailing spaces are a hard line break in Markdown, and three
        # documents here rely on it -- CLAUDE.md's header block among them.
        # Nothing noticed until `pre-commit install` was actually run for the
        # first time on 2026-09-04, at which point the hook reflowed lines
        # nobody had touched. This flag is what it exists for.
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
  # Must match the `ruff==` pin in pyproject.toml and requirements/ci.txt.
  # It did not: the hook formatted with v0.12.0 while CI checked with 0.16.5,
  # and the two disagree about a docstring ending in an escaped quote. The
  # hook rewrote a file into a form `ruff format --check .` rejects, reported
  # success, and the commit sailed through to a red CI -- the failure mode
  # pyproject's own pin comment exists to prevent, reached from the one side
  # that pin does not cover. `test_ruff_versions_agree` keeps them together.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Blocks a secret before it enters history, which is the only point at which
  # removing one is cheap: once pushed, a credential is compromised and the
  # answer is rotation, not a revert. CI runs the same script over every tracked
  # file, because this hook is skippable (--no-verify) and is not installed in a
  # fresh clone until someone runs `pre-commit install`.
  - repo: local
    hooks:
      - id: check-sensitive
        name: sensitive content gate
        entry: python scripts/check_sensitive.py
        language: system
        pass_filenames: true
