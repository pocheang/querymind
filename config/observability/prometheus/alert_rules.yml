# Prometheus alerting rules for QueryMind.
#
# Every series named here has a producer, and tests/core/test_alert_rules_have_producers.py
# fails when one does not. Until ARC-01 phase 8 (2026-09-25) only the two rules on
# `up` could fire: the other nineteen watched metrics nothing in app/ emitted, and
# the request metrics the application did record never reached /metrics.
#
# Series (app/services/runtime/runtime_metrics.py, app/api/routes/operations/metrics_collectors.py):
#   http_requests_total{status, kind}                kind: query | stream | other
#   http_request_duration_seconds_bucket{kind, le}
#   embedding_reindex_total{outcome}                 outcome: queued | failed
#   circuit_breaker_open_until_seconds{breaker}      Unix time; open while > time()
#   query_guard_inflight, query_guard_waiting
#   dependency_up{dependency}, dependency_required{dependency}
# With several workers, /metrics sums them (prometheus_client multiprocess mode).
#
# Removed with no producer to watch -- add the producer first to bring one back:
#   HighAgentErrorRate, LLMCostExceeded, LLMCostIncreasing, LowRetrievalQuality,
#   LowCacheHitRate, EmbeddingModelSlow, LongUserSessions, NewAgentDeployed,
#   HighMemoryUsage (multiprocess mode has no per-process collector; use the
#   container runtime's metrics). The four *Unreachable rules are one
#   DependencyUnreachable, which fires only for a dependency this deployment requires.

groups:
  - name: rag_system_critical
    interval: 30s
    rules:
      - alert: SystemUnhealthy
        expr: |
          up{job="rag-api"} == 0
        for: 1m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "RAG API is down"
          description: "RAG API instance {{ $labels.instance }} has been down for more than 1 minute"
          action: "Check application logs and restart service if needed"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{kind="query",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{kind="query"}[5m]))
          > 0.10
        for: 5m
        labels:
          severity: critical
          component: queries
        annotations:
          summary: "More than 10% of questions fail with a server error"
          description: "5xx ratio on POST /api/advanced-rag/query: {{ $value | humanizePercentage }}"
          action: "Check application logs; a 503 names an unavailable dependency, a 500 this service"

      - alert: AllCircuitBreakersOpen
        expr: |
          count(max by (breaker) (circuit_breaker_open_until_seconds) > time()) >= 3
        for: 2m
        labels:
          severity: critical
          component: resilience
        annotations:
          summary: "Three or more circuit breakers are open"
          description: "{{ $value }} circuit breakers are currently open, indicating widespread service issues"
          action: "Check external service availability and logs"

  - name: rag_system_warnings
    interval: 1m
    rules:
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{kind="query"}[5m]))
          ) > 4
        for: 5m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "P95 question latency exceeds 4 seconds"
          description: "P95 latency of POST /api/advanced-rag/query: {{ $value | humanizeDuration }}"
          action: "Check the execution trace for the slow stage"

      - alert: CircuitBreakerOpen
        expr: |
          max by (breaker) (circuit_breaker_open_until_seconds) > time()
        for: 1m
        labels:
          severity: warning
          component: resilience
        annotations:
          summary: "Circuit breaker {{ $labels.breaker }} is open"
          description: "Calls through {{ $labels.breaker }} are being refused on at least one worker"
          action: "Check the service behind this breaker"

      - alert: DependencyUnreachable
        expr: |
          dependency_up == 0 and on (dependency) dependency_required == 1
        for: 2m
        labels:
          severity: critical
          component: dependencies
        annotations:
          summary: "{{ $labels.dependency }} is unreachable"
          description: "A dependency this deployment requires did not answer its probe"
          action: "Check the {{ $labels.dependency }} container and its network"

      - alert: EmbeddingReindexFailed
        expr: |
          increase(embedding_reindex_total{outcome="failed"}[1h]) > 0
        labels:
          severity: warning
          component: ingestion
        annotations:
          summary: "A full vector rebuild could not be queued"
          description: "Model settings were saved but the embedding reindex failed to start"
          action: "Check the ingest queue and retry from the admin console"

  - name: rag_system_info
    interval: 5m
    rules:
      - alert: HighQueryRate
        expr: |
          sum(rate(http_requests_total{kind="query"}[5m])) > 100
        for: 10m
        labels:
          severity: info
          component: capacity
        annotations:
          summary: "Unusually high question rate"
          description: "Questions per second: {{ $value }}"
          action: "Consider scaling if this is expected traffic"

  - name: rag_system_slo
    interval: 5m
    rules:
      - alert: SLOErrorRateBreach
        expr: |
          (
            sum(rate(http_requests_total{kind="query",status=~"5.."}[30m]))
            /
            sum(rate(http_requests_total{kind="query"}[30m]))
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          component: slo
        annotations:
          summary: "Error rate SLO breach (target: <5%)"
          description: "Current error rate: {{ $value | humanizePercentage }}"
          action: "Investigate error patterns and recent changes"

      - alert: SLOLatencyBreach
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{kind="query"}[30m]))
          ) > 4
        for: 10m
        labels:
          severity: warning
          component: slo
        annotations:
          summary: "Latency SLO breach (target: P95 <4s)"
          description: "Current P95 latency: {{ $value | humanizeDuration }}"
          action: "Analyze slow queries and optimize performance"

      - alert: SLOAvailabilityBreach
        # avg_over_time, not rate: `up` is a gauge, and rate() of a gauge is not
        # a fraction of anything.
        expr: |
          avg(avg_over_time(up{job="rag-api"}[1h])) < 0.99
        for: 5m
        labels:
          severity: critical
          component: slo
        annotations:
          summary: "Availability SLO breach (target: >99%)"
          description: "Current availability: {{ $value | humanizePercentage }}"
          action: "Investigate service stability and infrastructure issues"

