server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Server-sent events: the execution stream and the agent-tracking stream.
    # Buffering would hold events until a buffer fills, so the draft answer and
    # the stage timeline would arrive in bursts or at the end. A regex location
    # is preferred over the /api/ prefix below, and proxy_pass without a URI
    # hands the path through unchanged. No session stickiness is needed: the
    # events are in Redis (ARC-01 phase 3), so any worker can serve a stream.
    location ~ ^/api/(v1/orchestration/executions/[^/]+/events|agent-tracking/stream/) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, not appended: $proxy_add_x_forwarded_for keeps whatever the
        # client sent in first place, and the backend trusts this header from
        # nginx (QUERYMIND_TRUSTED_PROXIES) -- so appending would let a client choose
        # its own address for every rate limit (SEC-02).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for long answers
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # React Router support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable cache for index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
